[package]
name = "rusbmux"
version = "0.3.0"
edition = "2024"
authors = ["Abdullah Al-Banna"]
description = "A usbmuxd replacement in pure Rust"
documentation = "https://docs.rs/rusbmux"
repository = "https://github.com/abdullah-albanna/rusbmux"
homepage = "https://github.com/abdullah-albanna/rusbmux"
license = "MIT OR Apache-2.0"
categories = ["network-programming"]
keywords = ["apple", "usb", "usbmuxd", "multiplexing", "ios"]
rust-version = "1.88"

[dependencies]
plist-macro = "0.1.6"
plist = "1.10.0"

bytemuck = "1.25.2"
dashmap = "6.2.1"
bytes = "1.12.1"

nusb = { version = "0.2.5", features = ["tokio"], optional = true }
rusb = { version = "0.9.4", optional = true }

tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-util = "0.7.19"
futures-lite = { version = "2.6.1", default-features = false }

crossfire = { version = "3.1.19", features = ["tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
], optional = true }

thiserror = "2.0.19"

mdns-sd = "0.20.3"

idevice = { version = "=0.1.68", default-features = false, features = [
  "heartbeat",
  "mdns",
  "notification_proxy",
  "pair",
  "ring",
  "tcp",
] }
uuid = { version = "1.24.0", features = ["v4"] }
async-stream = "0.3.6"

pack1 = "1.1.0"
bitflags = "2.13.1"
etherparse = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
rustix = { version = "1.1.4", features = ["net"], optional = true }
libc = "0.2.189"


[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Networking",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
idevice = { version = "=0.1.68", features = ["full"] }

[features]
default = ["bin", "nusb"]
bin = [
  "dep:rustix",
  "tokio/net",
  "tokio/signal",
  "tokio/rt-multi-thread",
  "dep:tracing-subscriber",
  "dep:anyhow",
  "dep:clap",
]
nusb = ["dep:nusb"]
rusb = ["dep:rusb"]
rusb-vendored = ["dep:rusb", "rusb/vendored"]


[[bin]]
name = "rusbmux"
required-features = ["bin"]

