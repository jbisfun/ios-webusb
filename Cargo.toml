[package]
name = "ios-webusb"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Userland usbmuxd for iOS devices with a gpui tray; the WebUSB driver lives in web/"
repository = "https://github.com/jbisfun/ios-webusb"

[workspace]
members = [".", "web"]

[[bin]]
name = "ios-webusb"
path = "src/main.rs"

[dependencies]
# USB driver: vendored rusbmux (idevice bumped to Jimpactor's pin, lockdown dir configurable).
rusbmux = { path = "vendor/rusbmux" }
# Same idevice pin as Jimpactor.
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "pair", "ring"] }
uuid = { version = "1", features = ["v4"] }

gpui = { path = "../ycode/crates/gpui" }
gpui_platform = { path = "../ycode/crates/gpui_platform", features = ["wayland", "x11"] }
ksni = "0.3"

tokio = { version = "1.43", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dirs = "6"
anyhow = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gpui relies on these fixes from ycode's workspace.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
